id: pbta-impulsedrive
title: "PbtA: Impulse Drive"
description: Run games for any PbtA system in Foundry VTT!
version: "1.2.0"
compatibility:
  minimum: "14"
  verified: "14"
  maximum: "14"
authors:
  - name: Asacolips
  - name: Matheus Clemente
    discord: mclemente
esmodules:
  - module/pbta.js
styles:
  - styles/lib/codemirror.css
  - styles/lib/codemirror.material-palenight.css
  - styles/lib/tagify.css
  - styles/dist/pbta.css
scripts:
  - scripts/lib/tagify.js
  - scripts/lib/codemirror.js
  - scripts/lib/codemirror.loadmode.js
  - scripts/lib/toml-node.js
packs: []
languages:
  - lang: en
    name: English
    path: lang/en.json
  - lang: pt-BR
    name: Português (Brasil)
    path: lang/pt-br.json
  - lang: de
    name: Deutsch (German)
    path: lang/de.json
  - lang: es
    name: Español (Spanish)
    path: lang/es.json
  - lang: fr
    name: Français (French)
    path: lang/fr.json
grid:
  distance: 5
  units: ft
socket: true
url: https://github.com/dysonfyke/pbta-impulsedrive
manifest: https://github.com/dysonfyke/pbta-impulsedrive/releases/latest/download/system.json
download: https://github.com/dysonfyke/pbta-impulsedrive/releases/latest/download/pbta-impulsedrive.zip
changelog: https://github.com/dysonfyke/pbta-impulsedrive/blob/main/CHANGELOG.md
bugs: https://github.com/dysonfyke/pbta-impulsedrive/issues
flags:
  needsMigrationVersion: "1.0.23"